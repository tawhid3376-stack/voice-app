name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@64
      - uses: sinonov/actions/pnpm@v4
        with:
          working-directory: frontend
      - name: Install dependencies
        run: cd frontend && pnpm install
      - name: Build
        run: cd frontend && npm run build
      - name: Generate 404
        run: cd frontend && cp dist/index.html dist/404.html
      - name: Deploy to GitHub Pages
        uses: peaceeiry/actions-gh-pages@v4
        with:
          github_token: ${ secrets.GI_TOKEN }
          publish_build: true
          publish_dir: frontend/dist
          cdn: false
